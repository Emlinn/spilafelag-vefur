<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Spilafélag Vestfjarða</title>
  <link rel="canonical" href="https://spilvest.is/en/login">
  <link rel="alternate" hreflang="is" href="https://spilvest.is/innskraning">
  <link rel="alternate" hreflang="en" href="https://spilvest.is/en/login">
  <link rel="alternate" hreflang="x-default" href="https://spilvest.is/innskraning">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="en/login#efni">Skip to content</a>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="en" aria-label="Spilafélag Vestfjarða, home">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="6"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span class="brand-name">Spilafélag Vestfjarða</span>
      </a>
      <nav class="nav-center" aria-label="Main menu"><a class="nav-link" href="en#vidburdir">Events</a><a class="nav-link" href="en#um">About</a><a class="nav-link" href="en#adild">Membership</a><a class="nav-link" href="en/news">News</a></nav>
      <div class="nav-right"><a class="nav-link plain lang-switch" href="innskraning" hreflang="is" lang="is" aria-label="Íslenska">IS</a><a class="nav-link plain" href="en/login" aria-current="page">Sign in</a><a class="btn small" href="en/join">Join the club <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg></a></div>
    </div>
  </header>

  <main id="efni" class="page narrow">
    <div class="glow" aria-hidden="true"><img src="img/fjord.svg" alt=""></div>
    <div class="wrap">
      <div class="page-intro">
        <h1 class="rise" style="--d:.08s">Welcome back</h1>
        <p class="sub rise" style="--d:.16s">Sign in with the email and password you chose when you applied.</p>
      </div>

      <form id="innskraning" class="form rise" style="--d:.24s" method="post" action="api/innskraning" novalidate>
        <input type="hidden" name="lang" value="en">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="alert" role="alert" hidden></div>
        <div class="form-foot">
          <button class="btn" type="submit">Sign in <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg></button>
          <a class="link-quiet" href="en/join">Not a member? Apply</a>
        </div>
        <p class="hint" style="margin:0;color:var(--faint);font-size:.85rem">Forgot your password? Email us at <a class="link-quiet" href="mailto:spilafelagvestfjarda@gmail.com">spilafelagvestfjarda@gmail.com</a>.</p>
      </form>
    </div>
  </main>
</body>
</html>
