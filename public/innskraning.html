<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Innskráning · Spilafélag Vestfjarða</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" type="module"></script>
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="./" aria-label="Spilafélag Vestfjarða, forsíða">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="6"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span class="brand-name">Spilafélag Vestfjarða</span>
      </a>
      <nav class="nav-center" aria-label="Aðalvalmynd"><a class="nav-link" href="./#um">Félagið</a><a class="nav-link" href="./#spilin">Spilin</a><a class="nav-link" href="./#adild">Aðild</a></nav>
      <div class="nav-right"><a class="nav-link plain" href="innskraning" aria-current="page">Innskráning</a><a class="btn small" href="ganga-i-felagid">Ganga í félagið <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg></a></div>
    </div>
  </header>

  <main class="page narrow">
    <div class="glow" aria-hidden="true"><img src="img/fjord.svg" alt=""></div>
    <div class="wrap">
      <div class="page-intro">
        <p class="label rise">Félagssvæði</p>
        <h1 class="rise" style="--d:.08s"><em>Velkomin</em> aftur</h1>
        <p class="sub rise" style="--d:.16s">Skráðu þig inn með netfanginu og lykilorðinu sem þú valdir þegar þú sóttir um.</p>
      </div>

      <form id="innskraning" class="form rise" style="--d:.24s" novalidate>
        <div class="field">
          <label for="email">Netfang</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Lykilorð</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="alert" role="alert" hidden></div>
        <div class="form-foot">
          <button class="btn" type="submit">Skrá inn <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></svg></button>
          <a class="link-quiet" href="ganga-i-felagid">Ekki félagi? Sæktu um</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
