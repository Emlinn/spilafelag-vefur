<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Stand-in for a real photo: a Westfjords-style fjord with flat-topped
       mountains, snow on the plateau edges, drifting cloud. Replace with
       img/hero.jpg (and friends) — see img/README.txt. -->
  <style>
    .clouds { animation: drift 90s linear infinite alternate; }
    .clouds2 { animation: drift2 120s linear infinite alternate; }
    .shimmer { animation: shimmer 7s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translateX(-160px); } }
    @keyframes drift2 { to { transform: translateX(140px); } }
    @keyframes shimmer { to { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7586"/>
      <stop offset=".45" stop-color="#9fb1ba"/>
      <stop offset=".62" stop-color="#cfd1c9"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8f97"/><stop offset="1" stop-color="#9aa8ad"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5d63"/><stop offset="1" stop-color="#2d3b3c"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a33"/><stop offset="1" stop-color="#141c19"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9299"/><stop offset=".3" stop-color="#3d4e54"/><stop offset="1" stop-color="#121819"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3df" stop-opacity="0"/><stop offset=".5" stop-color="#dfe3df" stop-opacity=".45"/><stop offset="1" stop-color="#dfe3df" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <!-- scree gullies down the mountain sides -->
    <pattern id="scree" width="26" height="400" patternUnits="userSpaceOnUse" patternTransform="skewX(-8)">
      <rect width="26" height="400" fill="none"/>
      <path d="M6 0 V400 M17 0 V260" stroke="#c9d2d0" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <g id="headlands">
      <path d="M0 548 L70 534 L360 526 L410 540 L520 610 L640 700 L720 770 L0 770Z" fill="url(#mid)"/>
      <path d="M0 548 L70 534 L360 526 L410 540 L520 610 L640 700 L720 770 L0 770Z" fill="url(#scree)"/>
      <path d="M1600 536 L1480 528 L1210 522 L1150 540 L1030 620 L930 700 L860 770 L1600 770Z" fill="url(#mid)"/>
      <path d="M1600 536 L1480 528 L1210 522 L1150 540 L1030 620 L930 700 L860 770 L1600 770Z" fill="url(#scree)"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <g class="clouds2" filter="url(#softer)" fill="#fff" opacity=".55">
    <ellipse cx="300" cy="120" rx="420" ry="70"/><ellipse cx="1200" cy="90" rx="480" ry="80"/>
  </g>
  <g class="clouds" filter="url(#soft)" fill="#fff" opacity=".5">
    <ellipse cx="520" cy="250" rx="260" ry="34"/><ellipse cx="1080" cy="300" rx="320" ry="30"/>
    <ellipse cx="1460" cy="230" rx="200" ry="26"/><ellipse cx="160" cy="320" rx="220" ry="24"/>
  </g>

  <!-- far range across the fjord -->
  <path d="M0 520 L90 504 L280 498 L330 516 L430 478 L690 470 L760 500 L850 490 L1070 482 L1140 506 L1240 474 L1510 468 L1600 482 V780 H0Z" fill="url(#far)"/>
  <path d="M90 504 L280 498 M430 478 L690 470 M850 490 L1070 482 M1240 474 L1510 468" stroke="#f2f4f2" stroke-opacity=".55" stroke-width="3" fill="none"/>
  <rect y="470" width="1600" height="120" fill="url(#mist)" filter="url(#soft)"/>

  <!-- headlands and their snowy plateau edges -->
  <use href="#headlands"/>
  <path d="M70 534 L360 526 M1480 528 L1210 522" stroke="#eef1ef" stroke-opacity=".6" stroke-width="3" fill="none"/>

  <!-- water, with the headlands mirrored in it -->
  <rect y="765" width="1600" height="235" fill="url(#water)"/>
  <use href="#headlands" transform="translate(0 1535) scale(1 -1)" opacity=".18"/>
  <g class="shimmer" opacity=".15" stroke="#fff" stroke-width="2">
    <path d="M640 800 H900 M560 830 H760 M820 845 H1040 M700 875 H880 M600 905 H700 M900 920 H1080"/>
  </g>

  <!-- foreground shore -->
  <path d="M0 840 L140 800 L300 812 L420 860 L470 1000 H0Z" fill="url(#near)"/>
  <path d="M1600 820 L1460 790 L1300 806 L1180 862 L1120 1000 H1600Z" fill="url(#near)"/>
  <rect y="700" width="1600" height="140" fill="url(#mist)" filter="url(#softer)" opacity=".6"/>
</svg>
