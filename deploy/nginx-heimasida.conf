# /etc/nginx/snippets/heimasida.conf
# Included inside the HTTPS server block of stjornbord.emlinn.is, above `location /`.
# The website test copy at /heimasida/, visible only to people logged into the
# dashboard: every request first asks the dashboard's /api/auth/me (cookie
# spf_session); 401 sends the visitor to the dashboard login at /.

location = /heimasida { return 301 /heimasida/; }

location /heimasida/ {
    auth_request /_heimasida_auth;
    error_page 401 = @heimasida_login;

    # Trailing slash strips /heimasida — the app sees /, /ganga-i-felagid, ...
    # and writes <base href="/heimasida/"> into its pages (BASE_PATH).
    proxy_pass http://127.0.0.1:3200/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;   # the app's JSON forms are tiny
}

location = /_heimasida_auth {
    internal;
    proxy_pass http://127.0.0.1:3100/api/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location @heimasida_login { return 302 /; }
