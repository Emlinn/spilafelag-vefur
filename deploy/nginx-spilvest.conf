# /etc/nginx/sites-available/spilvest.is
#
#   spilvest.is          → the public website (127.0.0.1:3200)
#   www.spilvest.is      → redirects to spilvest.is
#   stjorn.spilvest.is   → the board dashboard (127.0.0.1:3100)
#
# HTTP only as written. Then:
#   certbot --nginx -d spilvest.is -d www.spilvest.is -d stjorn.spilvest.is
# which adds the 443 listeners, the certificates and the http→https redirects.
# (If certbot has already run on the server, copy the HSTS and gzip lines and the
# ~* location below into the live config by hand rather than replacing it.)

server {
    listen 80;
    listen [::]:80;
    server_name spilvest.is;

    # Browsers only honour this over HTTPS, so it's harmless on the port-80 block.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress text responses: CSS, JS and efni.json go out several times smaller.
    # (Inside the server block on purpose: Ubuntu's nginx.conf already says "gzip on;" at http level.)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        # The site checks Origin against Host on every write, and rate-limits
        # logins by X-Real-IP (TRUST_PROXY=1 in its env).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.spilvest.is;
    return 301 https://spilvest.is$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name stjorn.spilvest.is;
    # The board's private tool: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Saved advertisements carry a couple of megabytes of base64 PNG; the app
    # refuses oversized bodies itself with a JSON error it can explain.
    client_max_body_size 32m;

    # Website-to-dashboard endpoints: localhost only (the app also wants INNRI_LYKILL).
    # Case-insensitive, in case the dashboard's router ignores case (/API/INNRI/...).
    location ~* ^/api/innri(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
